<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>明日方舟・專輯歌曲投影頁</title>
  <style>
    :root {
      --ink: #d9f4ff;
      --muted: #6ba1b7;
      --line: rgba(99, 190, 231, .42);
      --cyan: #65d9ff;
      --panel: rgba(12, 43, 62, .7);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 1440px;
      height: 900px;
      overflow: hidden;
      background: #031321;
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
    }

    body {
      position: relative;
      background:
        radial-gradient(ellipse at 50% 61%, rgba(20, 111, 151, .24), transparent 39%),
        radial-gradient(ellipse at 71% 47%, rgba(15, 100, 142, .14), transparent 32%),
        linear-gradient(145deg, #061a2a 0%, #031321 54%, #04111d 100%);
    }

    .ambient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .86;
      background:
        radial-gradient(circle at 17% 31%, rgba(85, 201, 237, .18), transparent 15%),
        radial-gradient(circle at 84% 22%, rgba(40, 131, 184, .14), transparent 15%),
        radial-gradient(circle at 51% 72%, rgba(52, 180, 226, .12), transparent 25%);
      filter: blur(18px);
    }

    .top-rule, .floor-rule {
      position: absolute;
      left: 11%;
      width: 78%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(97, 202, 242, .38), transparent);
    }

    .top-rule { top: 18%; }
    .floor-rule { bottom: 21%; }

    .back {
      position: absolute;
      top: 42px;
      right: 58px;
      padding: 10px 19px;
      border: 1px solid rgba(120, 212, 248, .54);
      border-radius: 999px;
      color: var(--ink);
      font-size: 16px;
      letter-spacing: .08em;
      background: rgba(7, 30, 45, .64);
    }

    .visual-card {
      position: absolute;
      top: 85px;
      width: 190px;
      padding: 12px;
      border: 1px solid rgba(137, 224, 255, .55);
      background: rgba(8, 37, 53, .42);
      box-shadow: 0 14px 28px rgba(0, 0, 0, .32);
      transform-origin: center bottom;
    }

    .visual-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
    }

    .visual-card .label {
      margin-bottom: 9px;
      color: #72cce8;
      font-size: 13px;
      letter-spacing: .18em;
    }

    .visual-card.cover { left: 37px; transform: rotate(-7deg); }
    .visual-card.visual { right: 43px; width: 265px; transform: rotate(7deg); }

    .projection {
      position: absolute;
      top: 236px;
      left: 9.3%;
      width: 81.4%;
      min-height: 431px;
      padding: 29px 42px 25px;
      border: 1px solid rgba(125, 211, 247, .72);
      background:
        linear-gradient(180deg, rgba(20, 72, 97, .72), rgba(7, 34, 52, .58)),
        rgba(7, 29, 45, .48);
      box-shadow: 0 0 50px rgba(42, 170, 220, .12), inset 0 0 34px rgba(49, 177, 222, .08);
    }

    .projection::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -27px;
      left: 19%;
      width: 62%;
      height: 550px;
      background: linear-gradient(104deg, transparent 0%, rgba(80, 193, 236, .19) 48%, transparent 100%);
      clip-path: polygon(35% 0, 65% 0, 100% 100%, 0 100%);
      opacity: .8;
    }

    .eyebrow {
      color: #63bddc;
      font-size: 14px;
      letter-spacing: .24em;
    }

    h1 {
      margin: 7px 0 4px;
      color: #e3f6ff;
      font-size: 33px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .subtitle {
      color: #7ebbd0;
      font-size: 16px;
      letter-spacing: .08em;
    }

    .list {
      margin-top: 21px;
      border-top: 1px solid rgba(105, 201, 237, .35);
    }

    .song {
      display: grid;
      grid-template-columns: 58px 1fr 245px 74px;
      align-items: center;
      min-height: 51px;
      border-bottom: 1px solid rgba(105, 201, 237, .24);
      font-size: 16px;
    }

    .song .number { color: #65c6e8; font-size: 17px; letter-spacing: .04em; }
    .song .title { color: #d3ecf7; font-weight: 600; }
    .song .artist { color: #6e9fb2; }

    .play {
      justify-self: end;
      padding: 7px 17px;
      border: 1px solid rgba(123, 218, 255, .7);
      border-radius: 999px;
      color: #cbf1ff;
      font-size: 14px;
      text-align: center;
      background: rgba(23, 87, 116, .5);
    }

    .turntable {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 71px;
      width: 500px;
      height: 170px;
      transform: translateX(-50%);
      perspective: 620px;
    }

    .turntable::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 20px;
      width: 480px;
      height: 115px;
      transform: translateX(-50%) rotateX(69deg);
      border-radius: 50%;
      background:
        repeating-radial-gradient(ellipse at center, transparent 0 20px, rgba(82, 206, 255, .48) 21px 22px, transparent 23px 34px),
        radial-gradient(ellipse, rgba(56, 193, 238, .19), rgba(2, 16, 30, .08) 62%, transparent 70%);
      box-shadow: 0 0 32px rgba(63, 193, 245, .35);
    }

    .record {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 252px;
      height: 252px;
      transform: translateX(-50%) rotateX(68deg);
      border-radius: 50%;
      border: 1px solid rgba(192, 235, 255, .72);
      background:
        radial-gradient(circle at 50% 50%, #0b1521 0 14%, #1b222c 14.5% 15.3%, transparent 15.8%),
        repeating-radial-gradient(circle at center, rgba(198, 232, 248, .2) 0 1px, transparent 2px 6px),
        radial-gradient(circle at 40% 35%, #4b525c 0%, #121923 32%, #02060b 74%);
      box-shadow: 0 0 22px rgba(111, 219, 255, .35), 0 17px 28px rgba(0, 0, 0, .56);
    }

    .record::before {
      content: "";
      position: absolute;
      inset: 34%;
      border-radius: 50%;
      background: url("https://arknights-recruit-api.molly27molly.workers.dev/proxy-image?url=https%3A%2F%2Fweb.hycdn.cn%2Fsiren%2Fpic%2F20260803%2Fe5da71a705c8280720562f2bf8e03cf6.png") center / cover;
      box-shadow: 0 0 15px rgba(111, 225, 255, .55);
    }

    .record::after {
      content: "";
      position: absolute;
      inset: 49%;
      border-radius: 50%;
      background: #01050a;
    }

    .record-label {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      color: #9acfe2;
      font-size: 14px;
      letter-spacing: .2em;
      white-space: nowrap;
    }

    .footer {
      position: absolute;
      right: 57px;
      bottom: 25px;
      color: #6e9eaf;
      font-size: 13px;
      letter-spacing: .12em;
    }
  </style>
</head>
