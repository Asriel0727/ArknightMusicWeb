<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Arknights Music Web 資料流與服務架構</title>
  <desc id="desc">帶有服務標誌、資料庫圓柱與快取圖示的系統架構輔助圖。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#101c31"/><stop offset="1" stop-color="#1b1530"/></linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="worker" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3ecf8e"/><stop offset="1" stop-color="#118a57"/></linearGradient>
    <linearGradient id="youtube" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4747"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#020617" flood-opacity=".48"/></filter>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0 0L0 7L10 3.5z" fill="#67e8f9"/></marker>
    <marker id="grayArrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0 0L0 7L10 3.5z" fill="#a5b4fc"/></marker>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".05"/></pattern>
    <style>
      .eyebrow { fill:#94a3b8; font:700 12px system-ui,-apple-system,'Segoe UI',sans-serif; letter-spacing:1.8px; }
      .headline { fill:#f8fafc; font:750 27px system-ui,-apple-system,'Segoe UI',sans-serif; }
      .sub { fill:#cbd5e1; font:15px system-ui,-apple-system,'Segoe UI',sans-serif; }
      .cap { fill:#94a3b8; font:700 11px system-ui,-apple-system,'Segoe UI',sans-serif; letter-spacing:1.25px; }
      .name { fill:#f8fafc; font:750 18px system-ui,-apple-system,'Segoe UI',sans-serif; }
      .copy { fill:#cbd5e1; font:14px system-ui,-apple-system,'Segoe UI',sans-serif; }
      .tiny { fill:#bae6fd; font:700 11px system-ui,-apple-system,'Segoe UI',sans-serif; letter-spacing:.7px; }
      .panel { fill:#111f35; stroke:#304762; stroke-width:1; }
      .flow { fill:none; stroke:#67e8f9; stroke-width:2.5; marker-end:url(#blueArrow); }
      .sync { fill:none; stroke:#a5b4fc; stroke-width:2; stroke-dasharray:6 6; marker-end:url(#grayArrow); }
    </style>
  </defs>
  <rect width="1280" height="720" rx="30" fill="url(#bg)"/>
  <rect width="1280" height="720" rx="30" fill="url(#grid)"/>
  <circle cx="1160" cy="0" r="230" fill="#7c3aed" opacity=".13"/><circle cx="70" cy="735" r="250" fill="#0ea5e9" opacity=".10"/>
  <text class="eyebrow" x="58" y="56">ARKNIGHTS MUSIC WEB · VISUAL SYSTEM MAP</text>
  <text class="headline" x="58" y="94">前端體驗、資料庫與外部音樂來源的協作方式</text>
  <text class="sub" x="58" y="122">每個服務各司其職：瀏覽器顯示、Worker 協調、資料庫保存、外部平台供應內容。</text>

  <!-- browser -->
  <g filter="url(#shadow)">
    <rect x="58" y="188" width="238" height="390" rx="24" fill="#10213a" stroke="#2b6e9b"/>
    <rect x="58" y="188" width="238" height="8" rx="4" fill="url(#front)"/>
    <text class="cap" x="84" y="230">YOUR DEVICE</text>
    <rect x="82" y="255" width="190" height="132" rx="17" fill="#132b47" stroke="#28638b"/>
    <rect x="100" y="276" width="154" height="78" rx="8" fill="#071827" stroke="#3b82f6"/>
    <path d="M100 296H254" stroke="#3b82f6" stroke-opacity=".55"/><circle cx="111" cy="286" r="3" fill="#fb7185"/><circle cx="122" cy="286" r="3" fill="#fbbf24"/><circle cx="133" cy="286" r="3" fill="#4ade80"/>
    <rect x="115" y="310" width="55" height="8" rx="4" fill="#38bdf8"/><rect x="115" y="328" width="104" height="6" rx="3" fill="#64748b"/><rect x="115" y="341" width="82" height="6" rx="3" fill="#475569"/>
    <text class="name" x="82" y="424">Vue 3 + Vite</text><text class="copy" x="82" y="452">播放器、歌詞、圖鑑與清單</text>
    <rect x="82" y="488" width="190" height="62" rx="14" fill="#0a3552"/><text class="tiny" x="103" y="514">LOCAL STATE</text><text class="copy" x="103" y="536">Audio · Queue · UI</text>
  </g>

  <path class="flow" d="M296 382H410"/><text class="tiny" x="353" y="360" text-anchor="middle">API REQUESTS</text>

  <!-- worker -->
  <g filter="url(#shadow)">
    <rect x="420" y="188" width="300" height="390" rx="24" fill="#2a1e16" stroke="#a65c1a"/>
    <rect x="420" y="188" width="300" height="8" rx="4" fill="url(#worker)"/>
    <text class="cap" x="448" y="230">CONTROL PLANE</text>
    <circle cx="474" cy="274" r="24" fill="#fb923c" fill-opacity=".22"/><path d="M470 252l-13 25h14l-3 19 22-29h-14l5-15z" fill="#fdba74"/>
    <text class="name" x="512" y="277">Cloudflare Worker</text><text class="copy" x="448" y="320">統一 API、驗證、Proxy 與分享頁</text>
    <rect class="panel" x="448" y="352" width="244" height="52" rx="13"/><text class="tiny" x="470" y="375">ROUTES</text><text class="copy" x="470" y="394">Music · Recruit · User Library</text>
    <rect class="panel" x="448" y="418" width="244" height="52" rx="13"/><text class="tiny" x="470" y="441">RESILIENCE</text><text class="copy" x="470" y="460">Cache · Fallback · Normalization</text>
    <rect class="panel" x="448" y="484" width="244" height="66" rx="13"/><text class="tiny" x="470" y="507">SECURITY</text><text class="copy" x="470" y="528">Secrets 與 service role key</text>
  </g>

  <path class="flow" d="M720 280H814"/><path class="flow" d="M720 382H814"/><path class="flow" d="M720 484H814"/>

  <!-- storage -->
  <g filter="url(#shadow)">
    <rect x="824" y="188" width="210" height="390" rx="24" fill="#10263a" stroke="#28795f"/>
    <text class="cap" x="850" y="230">PERSISTENCE &amp; CACHE</text>
    <!-- Supabase database cylinder -->
    <g transform="translate(850 253)">
      <path d="M0 14C0 6 29 0 65 0s65 6 65 14v54c0 8-29 14-65 14S0 76 0 68z" fill="url(#db)"/>
      <ellipse cx="65" cy="14" rx="65" ry="14" fill="#55e6a5"/><path d="M0 42c0 8 29 14 65 14s65-6 65-14M0 68c0 8 29 14 65 14s65-6 65-14" fill="none" stroke="#bbf7d0" stroke-opacity=".55"/>
      <path d="M48 20l18-17h20L68 20zM48 20l18 17h20L68 20z" fill="#062f1f" fill-opacity=".72"/>
    </g>
    <text class="name" x="850" y="360">Supabase</text><text class="copy" x="850" y="384">歌曲、帳號、歌單、角色 EP</text>
    <!-- KV cube -->
    <g transform="translate(850 412)"><path d="M0 13L28 0l28 13v31L28 57 0 44z" fill="#8b5cf6"/><path d="M28 26v31M0 13l28 13 28-13" stroke="#ddd6fe" stroke-opacity=".55"/><text x="28" y="42" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="13" font-weight="800">KV</text></g>
    <text class="name" x="925" y="435">KV Store</text><text class="copy" x="925" y="458">Session 與資料快照</text>
    <!-- Cache cloud -->
    <g transform="translate(850 488)"><path d="M17 42h44a17 17 0 0 0 1-34 23 23 0 0 0-43 8A14 14 0 0 0 17 42z" fill="#38bdf8" fill-opacity=".92"/><path d="M28 26h23" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round"/></g>
    <text class="name" x="925" y="511">Cache API</text><text class="copy" x="925" y="534">圖片與 API 回應</text>
  </g>

  <path class="sync" d="M1034 280H1115"/><path class="sync" d="M1034 382H1115"/><path class="sync" d="M1034 484H1115"/>

  <!-- external logos -->
  <g filter="url(#shadow)">
    <rect x="1125" y="188" width="98" height="390" rx="24" fill="#251726" stroke="#70405c"/>
    <text class="cap" x="1174" y="230" text-anchor="middle">SOURCES</text>
    <!-- Monster Siren styled badge -->
    <circle cx="1174" cy="279" r="28" fill="#ef4444"/><path d="M1160 286c7-15 19-22 28-21-2 11-11 22-28 21z" fill="#fff"/><path d="M1179 264c-2 10-9 18-18 21" fill="none" stroke="#fecaca" stroke-width="2"/>
    <text x="1174" y="324" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="750">Music</text><text x="1174" y="342" text-anchor="middle" fill="#f9a8d4" font-family="system-ui" font-size="10">Monster Siren</text>
    <!-- Game data badge -->
    <rect x="1146" y="370" width="56" height="56" rx="16" fill="#475569"/><path d="M1161 409l13-28 13 28-13 8z" fill="#e2e8f0"/><circle cx="1174" cy="396" r="5" fill="#0f172a"/>
    <text x="1174" y="456" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="750">Game Data</text>
    <!-- Youtube logo -->
    <rect x="1145" y="480" width="58" height="40" rx="12" fill="url(#youtube)"/><path d="M1168 489l17 11-17 11z" fill="#fff"/>
    <text x="1174" y="549" text-anchor="middle" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="750">YouTube</text>
  </g>
  <text x="640" y="655" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="13">資料在 Worker 層整理後才提供給前端；資料庫與快取讓網站快速且不受單一外部來源影響。</text>
</svg>
