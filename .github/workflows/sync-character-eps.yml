name: Sync Character EP videos

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run checks MV mappings and audio alignment without database writes; apply saves results'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
  schedule:
    # 每日 02:40（Asia/Taipei）
    - cron: '40 18 * * *'

permissions:
  contents: read

concurrency:
  group: sync-character-eps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      # 角色 EP 同步不需要 repository 中的大型圖片資產；只取執行腳本與套件鎖檔，避免 checkout 卡住。
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            package.json
            package-lock.json
            scripts/character-ep-prts-bilibili.mjs
            scripts/character-ep-matching.mjs
            scripts/prts-character-ep-source.mjs
            scripts/supabase-headers.mjs
            scripts/bilibili-video-duration.mjs
            scripts/bilibili-audio-source.mjs
            scripts/character-ep-audio-sync.mjs
            scripts/character-ep-audio-sync.py
            scripts/audio-sync-requirements.txt
            shared/character-ep-audio-sync.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/audio-sync-requirements.txt
      - name: Install audio matching tools
        run: |
          python -m pip install -r scripts/audio-sync-requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Reconcile PRTS Character EP and embedded Bilibili video mapping
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode || 'dry-run' }}" = "apply" ]; then
            npm run character-eps:apply
          else
            npm run character-eps:dry-run
          fi
