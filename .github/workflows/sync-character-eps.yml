name: Sync Character EP videos

on:
  workflow_dispatch:
  schedule:
    # 每日 02:40（Asia/Taipei）
    - cron: '40 18 * * *'

permissions:
  contents: read

concurrency:
  group: sync-character-eps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_EP_SOURCE_HANDLE: rivervworkshop
    steps:
      # 角色 EP 同步不需要 repository 中的大型圖片資產；只取執行腳本與套件鎖檔，避免 checkout 卡住。
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            package.json
            package-lock.json
            scripts/sync-character-eps.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync YouTube Character EP videos
        run: npm run character-eps:sync
