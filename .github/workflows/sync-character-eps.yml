name: Sync Character EP videos

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run only reads PRTS character-MV mappings; apply writes Bilibili mappings'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
  schedule:
    # 每日 02:40（Asia/Taipei）
    - cron: '40 18 * * *'

permissions:
  contents: read

concurrency:
  group: sync-character-eps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BILIBILI_EP_SOURCE_UID: ${{ vars.BILIBILI_EP_SOURCE_UID }}
      BILIBILI_SESSDATA: ${{ secrets.BILIBILI_SESSDATA }}
    steps:
      # 角色 EP 同步不需要 repository 中的大型圖片資產；只取執行腳本與套件鎖檔，避免 checkout 卡住。
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            package.json
            package-lock.json
            scripts/character-ep-prts-bilibili.mjs
            scripts/character-ep-matching.mjs
            scripts/prts-character-ep-source.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Reconcile PRTS Character EP and Bilibili video matching
        run: |
          if [ "${{ inputs.mode || 'dry-run' }}" = "apply" ]; then
            npm run character-eps:apply
          else
            npm run character-eps:dry-run
          fi
