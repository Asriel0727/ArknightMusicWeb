name: Sync story snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 1 * *'

permissions:
  contents: write

concurrency:
  group: sync-story-snapshots
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh scripts and referenced media
        run: npm run story:sync -- --overwrite
      - name: Verify story snapshots
        run: node --test test/story-script.test.mjs test/story-resources.test.mjs
      - name: Verify production build
        run: npm run build
      - name: Commit complete snapshot
        id: commit
        shell: bash
        run: |
          git add public/story
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync story snapshots"
          git push
