name: Sync W2G story snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 1 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-story-w2g
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh script and images
        run: node scripts/story/sync-w2g-beg.mjs --overwrite
      - name: Commit complete snapshot
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- public/story/w2g-beg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/story/w2g-beg
          git commit -m "chore: sync W2G story snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.commit.outputs.changed == 'true'
        run: npm ci
      - if: steps.commit.outputs.changed == 'true'
        run: npm run build
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v4
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    if: needs.sync.outputs.changed == 'true'
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
