name: Sync story snapshots

on:
  workflow_dispatch:
  schedule:
    # Daily 02:30 in Asia/Taipei (UTC+8).
    - cron: '30 18 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-story-snapshots
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synchronize changed stories and new media
        run: npm run story:update -- --max-file-mib=95
      - name: Verify production build
        run: npm run build
      - name: Commit complete snapshot
        id: commit
        shell: bash
        run: |
          git add public/story scripts/story/localization-paths.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync story snapshots"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN pushes do not trigger the Pages workflow's push event.
      - name: Publish updated snapshots
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
